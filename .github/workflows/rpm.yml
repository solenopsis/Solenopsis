name: CD-CI for RPM

on:
    push:
        branches: [ master ]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

permissions:
    contents: write

jobs:
    build:
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && github.event.pusher.email != 'version-bump@solenopsis.org'
        runs-on: ubuntu-latest
        timeout-minutes: 30

        steps:
            - uses: actions/checkout@v4

            - name: Install build tools
              run: sudo apt-get update && sudo apt-get install -y rpm

            - name: Extract version information
              run: |
                  VERSION=$(rpm -q --queryformat '%{VERSION}\n' --specfile solenopsis.spec | head -1)
                  OLD_RELEASE=$(rpm -q --queryformat '%{RELEASE}\n' --specfile solenopsis.spec | head -1)
                  NEW_RELEASE=$((OLD_RELEASE + 1))

                  echo "VERSION=${VERSION}" >> $GITHUB_ENV
                  echo "OLD_RELEASE=${OLD_RELEASE}" >> $GITHUB_ENV
                  echo "NEW_RELEASE=${NEW_RELEASE}" >> $GITHUB_ENV
                  echo "RPM_BUILD_DIR=/tmp/solenopsis/RPMBUILD" >> $GITHUB_ENV

                  echo "Building version ${VERSION}-${NEW_RELEASE}"

            - name: Update spec file release
              run: |
                  sed -i "s/^Release:.*$/Release: ${NEW_RELEASE}/g" solenopsis.spec

            - name: Display updated spec
              run: cat solenopsis.spec

            - name: Build RPM
              run: |
                  mkdir -p "${RPM_BUILD_DIR}"/{BUILD,RPMS,SOURCES,SPECS,SRPMS} "${RPM_BUILD_DIR}/SOURCES/solenopsis-${VERSION}"

                  cp -a * "${RPM_BUILD_DIR}/SOURCES/solenopsis-${VERSION}/"
                  tar czf "${RPM_BUILD_DIR}/SOURCES/solenopsis-${VERSION}.tar.gz" -C "${RPM_BUILD_DIR}/SOURCES" "solenopsis-${VERSION}"

                  rpmbuild --define "_topdir ${RPM_BUILD_DIR}" -ba solenopsis.spec

            - name: Verify RPM was created
              run: |
                  RPM_FILE="${RPM_BUILD_DIR}/RPMS/noarch/solenopsis-${VERSION}-${NEW_RELEASE}.noarch.rpm"

                  if [ ! -f "${RPM_FILE}" ]; then
                    echo "ERROR: RPM not found: ${RPM_FILE}"
                    exit 1
                  fi
                  echo "Successfully built RPM: ${RPM_FILE}"
                  rpm -qip "${RPM_FILE}"

            - name: Install packagecloud CLI
              run: sudo gem install package_cloud -v 0.3.15

            - name: Deploy to packagecloud.io
              env:
                PACKAGECLOUD_TOKEN: ${{ secrets.FLOSSWARE_PACKAGECLOUD_TOKEN }}
              run: |
                  RPM_FILE="${RPM_BUILD_DIR}/RPMS/noarch/solenopsis-${VERSION}-${NEW_RELEASE}.noarch.rpm"

                  package_cloud push flossware/yum/el/8 "${RPM_FILE}"
                  package_cloud push flossware/yum/el/9 "${RPM_FILE}"
                  package_cloud push flossware/yum/el/10 "${RPM_FILE}"

                  package_cloud push flossware/yum/fedora/38 "${RPM_FILE}"
                  package_cloud push flossware/yum/fedora/39 "${RPM_FILE}"
                  package_cloud push flossware/yum/fedora/40 "${RPM_FILE}"
                  package_cloud push flossware/yum/fedora/41 "${RPM_FILE}"
                  package_cloud push flossware/yum/fedora/42 "${RPM_FILE}"
                  package_cloud push flossware/yum/fedora/43 "${RPM_FILE}"
                  package_cloud push flossware/yum/fedora/44 "${RPM_FILE}"

                  echo "Successfully deployed RPM to packagecloud.io/flossware/yum"

            - name: Commit version bump
              run: |
                  git config --local user.email "version-bump@solenopsis.org"
                  git config --local user.name "Version Upgrade"
                  git commit -m "Version bump [${VERSION}-${NEW_RELEASE}]" -a
                  git tag "${VERSION}-${NEW_RELEASE}"
                  git push origin master
                  git push origin "${VERSION}-${NEW_RELEASE}"
