name: Cleanup packagecloud.io per-OS repos

on:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    cleanup:
        runs-on: ubuntu-latest
        timeout-minutes: 15

        steps:
            - name: Install packagecloud CLI
              run: sudo gem install package_cloud -v 0.3.15

            - name: Remove packages from per-OS repos
              env:
                PACKAGECLOUD_TOKEN: ${{ secrets.FLOSSWARE_PACKAGECLOUD_TOKEN }}
              run: |
                  DISTROS=(
                      el/8
                      el/9
                      el/10
                      fedora/38
                      fedora/39
                      fedora/40
                      fedora/41
                      fedora/42
                      fedora/43
                      fedora/44
                  )

                  for distro in "${DISTROS[@]}"; do
                      echo "=== Cleaning ${distro} ==="
                      packages=$(package_cloud list flossware/yum/${distro} 2>/dev/null || true)
                      if [ -z "${packages}" ]; then
                          echo "  No packages found in ${distro}"
                          continue
                      fi
                      echo "${packages}" | while read -r pkg; do
                          if [ -n "${pkg}" ]; then
                              echo "  Removing: ${pkg}"
                              package_cloud yank flossware/yum/${distro} "${pkg}" || true
                          fi
                      done
                  done

                  echo "Cleanup complete"
